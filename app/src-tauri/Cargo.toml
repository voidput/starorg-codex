[package]
name = "starorg-strings-app"
description = "StarOrg Strings desktop app (Tauri shell over starorg-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "starorg-strings-app"

[lib]
name = "starorg_strings_app"
path = "src/lib.rs"

[[bin]]
name = "starorg-strings-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
starorg-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
starorg-data.workspace = true
toml.workspace = true
# Native folder/file/save dialogs, called from Rust only (no dialog permission for the
# webview; see capabilities/default.json).
tauri-plugin-dialog = "2"
# Update check (spec 11, 12; docs/updates.md). Only used when Settings -> Network ->
# "Check for updates" is on. The GitHub releases request goes through starorg-net (ureq, OS
# TLS); the updater plugin downloads and verifies signed installers (AppImage, NSIS, MSI).
# native-tls instead of the default rustls: OS trust store, like starorg-net.
starorg-net.workspace = true
semver = "1"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
# Opens the release page in the system browser, from Rust only, after the
# https://github.com/<repo>/releases allowlist check (update::allowed_release_url). The same
# crate and call tauri-plugin-opener uses for `open_url`, without the plugin: no webview
# permission, and not its Linux D-Bus stack (zbus 5 is flagged unmaintained by cargo deny).
open = { version = "5", features = ["shellexecute-on-windows"] }

[features]
# The real backend (src/contract/real/) over starorg-core and starorg-data is the default.
# `mock-backend` runs the window on the in-memory mock (src/contract/mock.rs) instead, for
# UI work without a game install. Tests always compile the mock (contract drift checks).
default = []
mock-backend = []
# The Microsoft Store build (docs/windows.md): the Store installs and updates the app, so
# this flavour never checks GitHub for releases and never installs an update itself; Settings
# says "Updates come from the Microsoft Store". release.yml builds it for the .msix.
store = []

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# The apply-flow tests run on elevated Windows CI runners through this override
# (fsutil::test_allow_elevated); never part of a release build.
starorg-core = { workspace = true, features = ["test-hooks"] }
# A synthetic DCB for the Developer mode worker tests (tests/real_dev.rs).
starorg-data = { workspace = true, features = ["synthetic-dcb"] }
tempfile.workspace = true

# Not `[lints] workspace = true`: the workspace forbids unsafe code, and this crate needs one
# `unsafe` block, `std::env::set_var` for the WebKitGTK workaround before any thread starts
# (spec 10.4). Same lints otherwise, with unsafe denied and allowed on that one function.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
