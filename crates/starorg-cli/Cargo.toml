[package]
name = "starorg-cli"
description = "StarOrg Strings command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "starorg_cli"
path = "src/lib.rs"

[[bin]]
name = "starorg-strings"
path = "src/main.rs"

[dependencies]
starorg-core.workspace = true
starorg-data.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
starorg-net = { workspace = true, optional = true }

[features]
# Opt-in network feature (addendum §1): `gamedata --use-published-data`. Off by default so
# the default CLI links no HTTP client (CI checks the default dependency tree).
published-dumps = ["dep:starorg-net"]

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
