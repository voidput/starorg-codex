[package]
name = "starorg-cli"
description = "StarOrg Codex command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "starorg_cli"
path = "src/lib.rs"

[[bin]]
name = "starorg-codex"
path = "src/main.rs"

[dependencies]
starorg-core.workspace = true
starorg-data.workspace = true
# Experimental local MCP server, stdio only here (no `http` feature: ci.yml's cli-deps job).
starorg-mcp.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
starorg-net = { workspace = true, optional = true }

[features]
# Opt-in network feature (addendum §1): `gamedata --use-published-data`. Off by default so
# the default CLI links no HTTP client (CI checks the default dependency tree).
published-dumps = ["dep:starorg-net"]
# Hidden test hooks (--test-stock-ini, --test-pause-after-write-ms, blueprints import
# --test-catalog). Never in a release binary; the integration tests turn it on through the
# self dev-dependency below. It also turns on starorg-core's test hooks (the
# STARORG_TEST_ALLOW_ELEVATED override, so the apply flow runs on elevated Windows CI runners).
test-hooks = ["starorg-core/test-hooks"]

[dev-dependencies]
starorg-cli = { path = ".", features = ["test-hooks"] }
# A synthetic DCB for the `dev` command tests.
starorg-data = { workspace = true, features = ["synthetic-dcb"] }
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
