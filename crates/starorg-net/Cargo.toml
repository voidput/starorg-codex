[package]
name = "starorg-net"
description = "HTTPS transport: published LIVE builds for Diff, the update check, the StarOrg Tools client and UEX market data (opt-in network features)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
starorg-core.workspace = true
serde.workspace = true
# preserve_order: the UEX files keep sc-gamedata's key order.
serde_json = { workspace = true, features = ["preserve_order"] }
# The OS TLS stack and trust store (SChannel on Windows, OpenSSL on Linux); no bundled
# certificate list.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
# StarOrg Tools sign-in: PKCE S256 and random verifier/state.
sha2.workspace = true
getrandom.workspace = true

[features]
# A local stand-in for StarOrg Tools on 127.0.0.1 (starorg::mock), for tests only: the app
# and this crate turn it on through dev-dependencies, never in a release build.
mock-server = []

[lints]
workspace = true

[dev-dependencies]
starorg-net = { path = ".", features = ["mock-server"] }
tempfile.workspace = true
