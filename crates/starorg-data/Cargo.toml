[package]
name = "starorg-data"
description = "Reads Data.p4k via StarBreaker; the only crate that depends on StarBreaker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
starbreaker-p4k.workspace = true
starbreaker-datacore.workspace = true
thiserror.workspace = true
starorg-core.workspace = true
serde.workspace = true
# preserve_order: object fields keep DataCore order, which "the first DamageInfo" (spec
# 5.4) depends on, as it does for the dumps' producer.
serde_json = { workspace = true, features = ["preserve_order"] }
crc32c.workspace = true
rayon.workspace = true

[features]
# `starbreaker::synthetic`: a small DCB built with StarBreaker's DcbBuilder, for the app's
# Developer mode tests (its dev-dependencies turn this on; never in a release build).
synthetic-dcb = []

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
