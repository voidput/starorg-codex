[package]
name = "starorg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# preserve_order: dataset columns and record fields keep file order (addendum 7.5).
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tempfile.workspace = true
toml.workspace = true
sha1.workspace = true
sha2.workspace = true
getrandom.workspace = true
memchr.workspace = true

# Windows only: process image paths (is the game running?) and the list of fixed drives
# (install discovery), through safe wrappers over Toolhelp/QueryFullProcessImageName and
# GetDriveType; the workspace forbids our own unsafe code. Not linked on Linux.
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }

# Linux only: the memory limit's default hard cap, RLIMIT_DATA, and the workers'
# non-dumpable flag (memlimit.rs), through rustix's safe getrlimit/setrlimit/prctl wrappers;
# already in the tree through tempfile.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[features]
# Test-only overrides (see fsutil::elevation_blocks_apply). Never in a release binary: only
# the dev-dependencies of starorg-cli and the app turn it on, and CI checks the normal tree.
test-hooks = []

[lints]
workspace = true

