[package]
name = "starorg-mcp"
description = "Experimental local MCP server: read-only game data tools over stdio (CLI) or loopback HTTP (app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
starorg-core.workspace = true
starorg-gamedata.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom = { workspace = true, optional = true }

[features]
# The loopback streamable-HTTP transport (the app). A plain std::net server, no HTTP crate;
# the CLI leaves it off and speaks stdio only (ci.yml checks the CLI's dependency tree).
http = ["dep:getrandom"]

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Tests write the UEX files with the real fetch code (a fake transport, no network).
starorg-net.workspace = true
starorg-mcp = { path = ".", features = ["http"] }

[lints]
workspace = true
