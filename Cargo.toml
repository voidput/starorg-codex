[workspace]
exclude = ["fuzz"]
resolver = "3"
# app/src-tauri inherits [workspace.package], so the GUI carries the single workspace version.
members = ["crates/starorg-core", "crates/starorg-data", "crates/starorg-gamedata", "crates/starorg-mcp", "crates/starorg-net", "crates/starorg-cli", "app/src-tauri"]

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/voidput/starorg-codex"
authors = ["voidput"]
publish = false

[workspace.dependencies]
starorg-core = { path = "crates/starorg-core" }
starorg-data = { path = "crates/starorg-data" }
starorg-gamedata = { path = "crates/starorg-gamedata" }
starorg-mcp = { path = "crates/starorg-mcp" }
starorg-net = { path = "crates/starorg-net" }
# StarBreaker: our mirror of diogotr7/StarBreaker (no changes of ours), pinned to the commit
# tested in spec 3.3. Bump only together with STARBREAKER_COMMIT in starorg-data.
starbreaker-p4k = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
starbreaker-datacore = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
starbreaker-common = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
# Developer mode asset export (addendum 7.16): models, textures, sounds, CryXML. Same rev.
starbreaker-3d = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
starbreaker-dds = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
starbreaker-wem = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
starbreaker-wwise = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
starbreaker-cryxml = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crc32c = "0.6"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
toml = "1"
rayon = "1"
sha1 = "0.11"
sha2 = "0.11"
getrandom = "0.4"
memchr = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Required: the extraction worker turns panics into errors with catch_unwind (spec 3.1, 3.3).
# Do not switch to "abort"; tests/release_profile.rs fails if this changes.
[profile.release]
panic = "unwind"

# Debug builds (`tauri dev`, `cargo run`) still read a 100+ GB archive: optimise the
# dependencies and the extraction crates, or a first extraction takes minutes instead of
# seconds. The rest of the workspace stays unoptimised for quick rebuilds and debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.starorg-data]
opt-level = 2

[profile.dev.package.starorg-gamedata]
opt-level = 2

# Builds the obtain hints over the datasets (20 s unoptimised on PTU, well under 1 s optimised).
[profile.dev.package.starorg-mcp]
opt-level = 2

# The generators: the app's preview, patch states and apply build the whole output table
# (about 3 s per build unoptimised).
[profile.dev.package.starorg-core]
opt-level = 2
