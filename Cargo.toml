[workspace]
resolver = "3"
# app/src-tauri joins the workspace later and inherits [workspace.package].
members = ["crates/starorg-core", "crates/starorg-data", "crates/starorg-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/voidput/starorg-strings"
authors = ["voidput"]
publish = false

[workspace.dependencies]
starorg-core = { path = "crates/starorg-core" }
starorg-data = { path = "crates/starorg-data" }
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Required: the extraction worker turns panics into errors with catch_unwind (spec 3.1, 3.3).
# Do not switch to "abort"; tests/release_profile.rs fails if this changes.
[profile.release]
panic = "unwind"
