# Fuzz: the cargo-fuzz targets in fuzz/ (the parsers for files users hand the app: global.ini,
# fleet exports, Smart Citizen's owned-blueprints.json), a few minutes each, weekly and on demand.
# A crash fails the run and uploads the input that caused it. docs/ci.md, "Fuzzing".
name: Fuzz
on:
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:
  pull_request:
    paths: ['fuzz/**', 'crates/starorg-core/src/ini.rs', 'crates/starorg-core/src/fleet/import.rs', 'crates/starorg-core/src/blueprints/import.rs']

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [global_ini, fleet_import, smart_citizen_export]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_EACH: ${{ github.event_name == 'pull_request' && '60' || '300' }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$SECONDS_EACH
      - name: Crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
