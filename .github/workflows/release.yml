# Release: release-please opens the release PR; merging it tags vX.Y.Z and creates the release.
# On release_created the matrix builds installers and CLI binaries, uploads them with SLSA
# attestations, then a checksum job uploads SHA256SUMS. With the updater signing secret set,
# the AppImage and Windows installers also get .sig files and latest.json (docs/updates.md). Tauri/app steps skip until app/ exists (#8).
# Windows extras (docs/windows.md, docs/release.md): Azure Artifact Signing signs the NSIS/MSI
# installers and the CLI exe only when the AZURE_* secrets and variables exist; the store job
# packs an unsigned .msix for Partner Center only when the MSIX_* variables exist. Without them
# both are skipped with a notice and the release is exactly as before.
# See docs/release.md for the throwaway v0.0.1 dry run.
name: Release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  cli:
    name: cli (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p starorg-cli --target ${{ matrix.target }}
      - name: Windows code signing (Azure Artifact Signing)
        if: runner.os == 'Windows'
        id: winsign
        uses: ./.github/actions/windows-signing
        with:
          has-secrets: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_SIGNING_PROFILE }}
      - name: Sign the CLI exe
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          artifact-signing-cli -e "$ENDPOINT" -a "$ACCOUNT" -c "$PROFILE" -d "StarOrg Strings CLI" \
            "target/${{ matrix.target }}/release/starorg-strings.exe"
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          name="starorg-strings-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          bin=target/${{ matrix.target }}/release/starorg-strings
          [ "${{ runner.os }}" = Windows ] && bin="$bin.exe"
          cp "$bin" LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  app:
    name: app (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect app/
        id: app
        shell: bash
        run: |
          if [ -f app/package.json ] && [ -f app/src-tauri/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "app/ not present, skipping installers"; fi
      - name: Install toolchain from rust-toolchain.toml
        if: steps.app.outputs.present == 'true'
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.app.outputs.present == 'true'
        with:
          workspaces: app/src-tauri
      - name: Tauri system libraries
        if: steps.app.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: npm ci
      # In-app updates (docs/updates.md): signed updater artifacts (.sig) and latest.json only
      # when the TAURI_SIGNING_PRIVATE_KEY secret exists AND app/src-tauri/updater-public-key.txt
      # holds the matching public key. Otherwise the installers build exactly as before,
      # without updater files, and the app treats every install as "download only".
      - name: Updater signing
        if: steps.app.outputs.present == 'true'
        id: signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          key=$(tr -d '[:space:]' < app/src-tauri/updater-public-key.txt)
          if [ "$HAS_KEY" = "true" ] && [[ "$key" == dW50cnVzdGVkIGNvbW1lbnQ6* ]]; then
            # Merged over tauri.conf.json by `tauri build --config` (path relative to app/).
            printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}\n' "$key" \
              > app/src-tauri/tauri.updater.conf.json
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No updater artifacts: add the TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) secrets and the public key in app/src-tauri/updater-public-key.txt (docs/updates.md)."
          fi
      # Authenticode for the direct download (docs/windows.md): Tauri runs bundle.windows.signCommand
      # on the app exe, the NSIS installer and uninstaller and the MSI. Only with every AZURE_*
      # secret and variable set; otherwise the installers stay unsigned exactly as before.
      - name: Windows code signing (Azure Artifact Signing)
        if: steps.app.outputs.present == 'true' && runner.os == 'Windows'
        id: winsign
        uses: ./.github/actions/windows-signing
        with:
          has-secrets: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_SIGNING_PROFILE }}
          write-tauri-config: app/src-tauri/tauri.signing.conf.json
      # Windows: NSIS and MSI. Linux: AppImage, deb, rpm. Version comes from the workspace crate.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: steps.app.outputs.present == 'true'
        id: tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty without the secret; the bundler reads it only with createUpdaterArtifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Read by artifact-signing-cli inside signCommand; empty unless signing is configured.
          AZURE_CLIENT_ID: ${{ steps.winsign.outputs.enabled == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.winsign.outputs.enabled == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ steps.winsign.outputs.enabled == 'true' && secrets.AZURE_TENANT_ID || '' }}
        with:
          projectPath: app
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseId: ""
          # latest.json lists the AppImage and NSIS/MSI updaters with their signatures.
          uploadUpdaterJson: ${{ steps.signing.outputs.enabled == 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ runner.os == 'Windows' && '--bundles nsis,msi' || '--bundles appimage,deb,rpm' }} ${{ steps.signing.outputs.args }} ${{ steps.winsign.outputs.enabled == 'true' && '--config src-tauri/tauri.signing.conf.json' || '' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.app.outputs.present == 'true'
        with:
          subject-path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm

  # Microsoft Store package (docs/windows.md, "Microsoft Store"). The Store flavour never checks
  # GitHub or installs updates (feature `store`). Unsigned on purpose: Partner Center signs what
  # it publishes, so this .msix is for Store submission only, not for sideloading. Needs the
  # repo variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER (CN=...) and MSIX_PUBLISHER_DISPLAY_NAME
  # from Partner Center -> Product identity; without them every step after the check is skipped.
  store:
    name: store (msix)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Store identity
        id: identity
        shell: bash
        run: |
          if [ ! -f app/package.json ] || [ ! -f app/src-tauri/Cargo.toml ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app/ not present, no Store package."
          elif [ -n "$MSIX_IDENTITY_NAME" ] && [ -n "$MSIX_PUBLISHER" ] && [ -n "$MSIX_PUBLISHER_DISPLAY_NAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Store package: set the repo variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME (docs/windows.md)."
          fi
      - name: Install toolchain from rust-toolchain.toml
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.identity.outputs.configured == 'true'
        with:
          key: store
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.identity.outputs.configured == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        if: steps.identity.outputs.configured == 'true'
        working-directory: app
        run: npm ci
      # The app exe only (assets are embedded): no installer, no updater artifacts. The worker
      # runs from the same exe, so nothing else goes into the package.
      - name: Build the Store flavour
        if: steps.identity.outputs.configured == 'true'
        working-directory: app
        run: npx tauri build --no-bundle --features store
      - name: Stage the package (AppxManifest.xml, logos)
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        run: node app/scripts/msix.ts stage --exe target/release/starorg-strings-app.exe --version "$VERSION" --out .tmp/msix
      - name: makeappx pack
        if: steps.identity.outputs.configured == 'true'
        shell: pwsh
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeappx = Get-ChildItem -Path $kits -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' -and $_.Directory.Parent.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1
          if (-not $makeappx) { throw "makeappx.exe not found under $kits (Windows SDK)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = "dist\starorg-strings_${env:VERSION}_x64_store-submission-unsigned.msix"
          & $makeappx.FullName pack /d .tmp\msix /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed ($LASTEXITCODE)" }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.identity.outputs.configured == 'true'
        with:
          subject-path: dist/*.msix
      - name: Upload to the release
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.msix --clobber
      # Optional, off by default: submit the package to Partner Center with the msstore CLI.
      # Needs the repo variable MS_STORE_SUBMIT=true and the Partner Center API secrets
      # (docs/windows.md, "Automatic submission"). Otherwise the owner uploads the .msix by hand.
      - name: Check the Partner Center secrets
        if: steps.identity.outputs.configured == 'true' && vars.MS_STORE_SUBMIT == 'true'
        shell: bash
        env:
          HAS_ALL: ${{ secrets.MS_STORE_TENANT_ID != '' && secrets.MS_STORE_SELLER_ID != '' && secrets.MS_STORE_CLIENT_ID != '' && secrets.MS_STORE_CLIENT_SECRET != '' && vars.MS_STORE_ID != '' }}
        run: |
          if [ "$HAS_ALL" != "true" ]; then
            echo "::error::MS_STORE_SUBMIT is true but a Partner Center secret or MS_STORE_ID is missing (docs/windows.md)"
            exit 1
          fi
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        if: steps.identity.outputs.configured == 'true' && vars.MS_STORE_SUBMIT == 'true'
      # --noCommit: the package lands in a draft submission; the owner reviews and submits it
      # in Partner Center (listing text, screenshots, age rating stay hand-made).
      - name: Submit to Partner Center (msstore, draft)
        if: steps.identity.outputs.configured == 'true' && vars.MS_STORE_SUBMIT == 'true'
        shell: pwsh
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_ID: ${{ vars.MS_STORE_ID }}
        run: |
          msstore reconfigure --tenantId $env:MS_STORE_TENANT_ID --sellerId $env:MS_STORE_SELLER_ID --clientId $env:MS_STORE_CLIENT_ID --clientSecret $env:MS_STORE_CLIENT_SECRET
          $pkg = Get-ChildItem dist\*.msix | Select-Object -First 1
          msstore publish $pkg.FullName --appId $env:MS_STORE_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }
  checksums:
    needs: [release-please, cli, app, store]
    # The Store package is extra: a failed store job must not keep SHA256SUMS off the release.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' && needs.cli.result == 'success' && needs.app.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS over every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out && cd out
          gh release download "$TAG" -R "$REPO" --pattern '*' --skip-existing
          rm -f SHA256SUMS latest.json
          sha256sum -- * | tee SHA256SUMS
          gh release upload "$TAG" -R "$REPO" SHA256SUMS --clobber
