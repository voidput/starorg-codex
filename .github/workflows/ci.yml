# CI: fmt, clippy, tests on Linux and Windows, release-mode worker test, cargo deny, UI checks.
# The Tauri/UI parts switch on by themselves once app/package.json exists (M0 #8).
name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml (channel, rustfmt, clippy).
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tauri system libraries
        if: runner.os == 'Linux' && hashFiles('app/src-tauri/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Game-dependent tests are #[ignore] and do not run here. On windows-latest this includes
      # the native apply flow (crates/starorg-cli/tests/native_flow.rs, the real backend tests)
      # and the cfg(windows) discovery tests; the runner is elevated, so those set the
      # test-hooks override instead of skipping.
      - run: cargo test --workspace --locked
      - name: Worker panic/kill process tests (release profile, panic=unwind)
        run: cargo test --release --locked -p starorg-cli --test worker
      - name: Tauri crate checks
        if: hashFiles('app/src-tauri/Cargo.toml') != ''
        working-directory: app/src-tauri
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      # Microsoft Store flavour (docs/windows.md): no release check, no updater, "Updates come
      # from the Microsoft Store". Built by release.yml's store job for the .msix.
      - name: Store flavour
        if: hashFiles('app/src-tauri/Cargo.toml') != ''
        working-directory: app/src-tauri
        run: |
          cargo clippy --all-targets --locked --features store -- -D warnings
          cargo test --locked --features store --lib update

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --workspace

  cli-deps:
    name: CLI has no GTK or HTTP client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo tree
        run: |
          tree=$(cargo tree -p starorg-cli --locked -e normal --prefix none)
          if echo "$tree" | grep -Eiq '^(gtk|gdk|webkit2gtk|tauri|reqwest|hyper|ureq|curl|isahc|attohttpc) '; then
            echo "forbidden dependency in the CLI tree:"
            echo "$tree" | grep -Ei '^(gtk|gdk|webkit2gtk|tauri|reqwest|hyper|ureq|curl|isahc|attohttpc) '
            exit 1
          fi
      # The test hooks (hidden CLI flags, STARORG_TEST_ALLOW_ELEVATED) come in only through
      # dev-dependencies; a release build of the CLI or the app must never carry them.
      - name: No test hooks in release builds
        run: |
          for p in starorg-cli starorg-codex-app; do
            if cargo tree -p "$p" --locked -e normal,features --prefix none | grep -q 'test-hooks'; then
              echo "::error::$p enables a test-hooks feature in its normal dependency tree"
              exit 1
            fi
          done

      # release-please bumps each workspace crate's Cargo.lock version by name
      # (release-please-config.json extra-files). A crate missing from that list keeps its old
      # lockfile version and every `--locked` release build fails after the bump.
      - name: Every workspace crate is bumped by release-please
        run: |
          missing=0
          for name in $(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].name'); do
            if ! jq -e --arg n "$name" '.packages["."]["extra-files"][] | select(.path == "Cargo.lock" and (.jsonpath | contains("\"" + $n + "\"")))' release-please-config.json >/dev/null; then
              echo "::error::release-please-config.json does not bump Cargo.lock for crate $name"
              missing=1
            fi
          done
          exit $missing

  ui:
    name: ui (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect app/
        id: app
        run: |
          if [ -f app/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "app/ not present yet, skipping"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: npm ci
      # Scripts are optional until the UI lands; --if-present keeps the job green without them.
      - name: Lint, type check, unit tests
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: |
          npm run --if-present lint
          npm run --if-present check
          npm run --if-present test

  # THIRD_PARTY_NOTICES.md freshness (scripts/gen-notices.sh). A warning, not a failure, so
  # Dependabot lock bumps stay green; the release regenerates it anyway (release.yml, notices).
  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      - name: Is THIRD_PARTY_NOTICES.md up to date?
        run: |
          scripts/gen-notices.sh --check || echo "::warning::THIRD_PARTY_NOTICES.md is stale: run scripts/gen-notices.sh and commit the result."

  # Push runs only (not PRs): Discord ping when any job above fails. No-ops without DISCORD_CI_WEBHOOK.
  notify-failure:
    if: failure() && github.event_name != 'pull_request'
    needs: [rust, deny, cli-deps, ui, notices]
    permissions: {}
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: CI
    secrets:
      webhook: ${{ secrets.DISCORD_CI_WEBHOOK }}
