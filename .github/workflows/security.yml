# Security: CodeQL (Rust, JS/TS, workflow files; no build needed), cargo-deny advisories (RustSec), npm audit in app/,
# dependency review on PRs, and a gitleaks secret scan over full history. Runs on main, PRs and weekly (new advisories
# against unchanged code). docs/ci.md.
name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build-mode none: Rust is analysed from source, so no GTK/WebKit system libraries are needed.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  cargo-audit:
    name: cargo audit (RustSec via cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --workspace
          command-arguments: advisories

  npm-audit:
    name: npm audit (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Shipped code: anything moderate+ fails. Dev tooling: high+ fails.
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies
        working-directory: app
        run: npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action: the action needs a paid licence key for organisation repos.
      # Pinned version + SHA-256 from the release's checksums file.
      - name: gitleaks detect (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # Push/schedule only (not PRs): Discord ping when any job above fails. No-ops without DISCORD_CI_WEBHOOK.
  notify-failure:
    if: failure() && github.event_name != 'pull_request'
    needs: [codeql, cargo-audit, npm-audit, secrets]
    permissions: {}
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: Security
    secrets:
      webhook: ${{ secrets.DISCORD_CI_WEBHOOK }}
