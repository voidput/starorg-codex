# cargo-deny configuration. StarBreaker is the only git dependency, and only from our mirror
# (ADR docs/decisions/starbreaker-as-library.md).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/voidput/StarBreaker"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
