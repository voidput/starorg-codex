# cargo-deny configuration. StarBreaker is the only git dependency, and only from our mirror
# (ADR docs/decisions/starbreaker-as-library.md).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/voidput/StarBreaker"]

[licenses]
# ISC: simple_asn1, via starbreaker-ui -> swf (Developer mode model export, addendum 7.16).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "MPL-2.0", "ISC"]
confidence-threshold = 0.8

# StarBreaker's crates carry no `license` field; the MIT LICENSE lives only at the repo root
# (verified at the pinned rev 041e5592). Re-check these whenever the pin moves.
[[licenses.clarify]]
crate = "starbreaker-common"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-datacore"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-p4k"
expression = "MIT"
license-files = []

# The asset export crates (addendum 7.16), same repo, same root LICENSE (MIT, Copyright (c)
# 2026 Diogo Trindade), verified at 041e5592.
[[licenses.clarify]]
crate = "starbreaker-3d"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-blend"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-chf"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-chunks"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-cryxml"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-dds"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-dna"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-gfx"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-ui"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-wem"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "starbreaker-wwise"
expression = "MIT"
license-files = []

[advisories]
ignore = [
  # proc-macro-error (unmaintained) comes in only via Tauri's Linux GTK3 stack (glib-macros);
  # no upgrade path until Tauri moves off gtk-rs 0.18. Build-time proc macro, not shipped code.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18 -> glib-macros; no fix upstream" },
  # rusttype and its ttf-parser (unmaintained) come in only via StarBreaker's UI-canvas
  # renderer (starbreaker-3d -> starbreaker-ui), used by Developer mode model export to draw
  # in-game screens; fonts read are the game's own. No upstream replacement at the pin.
  { id = "RUSTSEC-2021-0140", reason = "rusttype unmaintained; transitive via starbreaker-ui at the pinned rev" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.15 unmaintained; transitive via starbreaker-ui -> rusttype" },
]

[bans]
multiple-versions = "allow"
